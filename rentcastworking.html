pp"},c.default.createElement("style",null,`
        ${uJ}
        * { box-sizing: border-box; }
        .lg-app {
          font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
          background: ${I.bg};
          color: ${I.text};
          min-height: 100vh;
          display: flex;
          width: 100%;
          transition: background 0.18s ease, color 0.18s ease;
        }
        h1, h2, h3 { font-family: 'Fraunces', ui-serif, Georgia, serif; margin: 0; font-weight: 500; letter-spacing: -0.01em; }
        h1 { font-size: 26px; color: ${I.text}; }
        h2 { font-size: 19px; color: ${I.text}; }
        h3 { font-size: 18px; color: ${I.text}; }
        p { margin: 0; }
        button { font-family: inherit; cursor: pointer; }
        select, input { font-family: inherit; }

        /* Sidebar \u2014 a fixed dark brand rail in both themes */
        .lg-sidebar {
          width: 224px;
          flex-shrink: 0;
          background: ${V.ink};
          color: ${V.ivory};
          display: flex;
          flex-direction: column;
          padding: 22px 14px;
          min-height: 100vh;
          position: sticky;
          top: 0;
        }
        .lg-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px 8px; }
        .lg-brand-mark {
          width: 32px; height: 32px; border-radius: 7px;
          background: linear-gradient(155deg, ${V.gold}, #8f7136);
          display: flex; align-items: center; justify-content: center;
          font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; color: ${V.ink};
        }
        .lg-brand-name { font-family: 'Fraunces', serif; font-size: 15.5px; letter-spacing: 0.01em; }
        .lg-brand-tag { font-size: 10.5px; color: ${V.mutedOnDark}; margin-top: 1px; }
        .lg-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .lg-nav-item {
          display: flex; align-items: center; gap: 10px;
          background: transparent; border: none; color: ${V.mutedOnDark};
          padding: 10px 10px; border-radius: 7px; font-size: 13.5px; text-align: left;
          position: relative; transition: background 0.15s, color 0.15s;
        }
        .lg-nav-item:hover { background: rgba(246,242,232,0.06); color: ${V.ivory}; }
        .lg-nav-item-active { background: ${V.goldSoft}; color: ${V.gold}; }
        .lg-nav-dot { margin-left: auto; width: 5px; height: 5px; border-radius: 50%; background: ${V.gold}; }
        .lg-sidebar-foot { padding: 10px 8px 2px 8px; }
        .lg-sidebar-foot-line { height: 1px; background: ${V.lineOnDark}; margin-bottom: 10px; }
        .lg-sidebar-foot-text { font-size: 10.5px; color: ${V.mutedOnDark}; }

        /* Page layout */
        .lg-page { flex: 1; padding: 34px 42px 60px; max-width: 1180px; }
        .lg-page-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
        .lg-page-sub { color: ${I.muted}; font-size: 13.5px; margin-top: 5px; }
        .lg-head-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .lg-back-link {
          display: inline-flex; align-items: center; gap: 4px; background: none; border: none;
          color: ${I.muted}; font-size: 13px; padding: 0; margin-bottom: 14px;
        }
        .lg-back-link:hover { color: ${I.text}; }

        /* Stat grid \u2014 always the dark brand card, regardless of theme */
        .lg-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .lg-stat {
          background: ${V.ink}; color: ${V.ivory}; border-radius: 10px; padding: 16px 17px;
          border: 1px solid ${V.ink2};
        }
        .lg-stat-label { font-size: 11px; color: ${V.mutedOnDark}; margin-bottom: 8px; letter-spacing: 0.01em; }
        .lg-stat-value { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 500; color: ${V.gold}; }
        .lg-stat-sub { font-size: 11.5px; margin-top: 6px; color: ${V.mutedOnDark}; display: flex; align-items: center; gap: 3px; }
        .lg-up { color: #7FAE86 !important; }
        .lg-down { color: #C77B62 !important; }

        /* Cards */
        .lg-card { background: ${I.surface}; border: 1px solid ${I.border}; border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
        .lg-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .lg-chart-card { padding-bottom: 8px; }
        .lg-chart-title { font-size: 13.5px; font-weight: 600; margin-bottom: 12px; color: ${I.text}; }

        /* Table */
        .lg-table-wrap { padding: 0; overflow: hidden; }
        .lg-table { width: 100%; border-collapse: collapse; }
        .lg-table th {
